name: Refresh Pac-Man contribution trail
on:
  workflow_dispatch:
  schedule:
    - cron: '19 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_pacman.py'
      - '.github/workflows/activity.yml'
permissions:
  contents: write
concurrency:
  group: profile-arcade
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate real-data arcade animation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_pacman.py
      - name: Validate generated SVG files
        run: |
          python3 -c "import xml.etree.ElementTree as e; e.parse('assets/pacman-dark.svg'); e.parse('assets/pacman-light.svg')"
      - name: Publish refreshed contribution trail
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pacman-dark.svg assets/pacman-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Pac-Man contribution trail [skip ci]'
          git push
