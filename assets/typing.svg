<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="64" viewBox="0 0 1100 64" role="img"><title>Animated introduction: building software, exploring AI, solving real-world problems</title><defs><style>.cursor{animation:blink .8s steps(1,end) infinite}.line{font-family:monospace;font-size:23px;fill:#55a69c;font-weight:600}.t1{animation:show1 12s steps(1,end) infinite}.t2{animation:show2 12s steps(1,end) infinite}.t3{animation:show3 12s steps(1,end) infinite}.mask{animation:type 4s steps(30,end) infinite}@keyframes blink{50%{opacity:0}}@keyframes show1{0%{opacity:1}33.333%,100%{opacity:0}}@keyframes show2{0%{opacity:0}33.333%{opacity:1}66.666%,100%{opacity:0}}@keyframes show3{0%,66.665%{opacity:0}66.666%,100%{opacity:1}}@keyframes type{0%{width:0px}49%,82%{width:445px}100%{width:0px}}@media(prefers-reduced-motion:reduce){.cursor,.line,.mask{animation:none}.t2,.t3{opacity:0}.mask{width:445px}}</style><clipPath id="reveal"><rect x="0" y="0" width="445" height="64" class="mask"/></clipPath></defs><g transform="translate(350 0)"><g clip-path="url(#reveal)"><text x="0" y="39" class="line t1">Building software.<tspan class="cursor">_</tspan></text><text x="0" y="39" class="line t2" opacity="0">Exploring intelligent systems.<tspan class="cursor">_</tspan></text><text x="0" y="39" class="line t3" opacity="0">Solving real-world problems.<tspan class="cursor">_</tspan></text></g></g></svg>
