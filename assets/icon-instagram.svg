<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54" role="img"><title>Instagram</title><defs><style>.orbit{transform-origin:27px 27px;animation:orbit 6s linear infinite;animation-delay:-2.2s}.logo{transform-origin:27px 27px;animation:breathe 3.6s ease-in-out infinite;animation-delay:-1.2s}.halo{animation:halo 3.6s ease-in-out infinite;animation-delay:-1.2s}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.10)}}@keyframes halo{0%,100%{opacity:.22}50%{opacity:.85}}@media(prefers-reduced-motion:reduce){.orbit,.logo,.halo{animation:none}}</style></defs><rect x="5" y="5" width="44" height="44" rx="13" fill="#14232c" stroke="#ef91bf" stroke-opacity=".25"/><rect class="halo" x="5" y="5" width="44" height="44" rx="13" fill="none" stroke="#ef91bf" opacity=".35"/><g class="orbit"><circle cx="27" cy="3" r="1.8" fill="#ef91bf"/></g><g class="logo" color="#ef91bf"><g transform="translate(15 15)"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></g><circle cx="17.6" cy="6.5" r="1.2" fill="currentColor"/></g></g></svg>
