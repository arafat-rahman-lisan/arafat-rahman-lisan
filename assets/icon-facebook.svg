<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54" role="img"><title>Facebook</title><defs><style>.orbit{transform-origin:27px 27px;animation:orbit 6s linear infinite;animation-delay:-1.1s}.logo{transform-origin:27px 27px;animation:breathe 3.6s ease-in-out infinite;animation-delay:-0.6s}.halo{animation:halo 3.6s ease-in-out infinite;animation-delay:-0.6s}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.10)}}@keyframes halo{0%,100%{opacity:.22}50%{opacity:.85}}@media(prefers-reduced-motion:reduce){.orbit,.logo,.halo{animation:none}}</style></defs><rect x="5" y="5" width="44" height="44" rx="13" fill="#14232c" stroke="#82b1ff" stroke-opacity=".25"/><rect class="halo" x="5" y="5" width="44" height="44" rx="13" fill="none" stroke="#82b1ff" opacity=".35"/><g class="orbit"><circle cx="27" cy="3" r="1.8" fill="#82b1ff"/></g><g class="logo" color="#82b1ff"><g transform="translate(15 15)"><path fill="currentColor" d="M14 22v-9h3l.5-3.5H14V7.3c0-1 .3-1.8 1.8-1.8H18V2.3A26 26 0 0 0 15 2c-3 0-5 1.8-5 5v2.5H7V13h3v9z"/></g></g></svg>
