<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54" role="img"><title>Portfolio</title><defs><style>.orbit{transform-origin:27px 27px;animation:orbit 6s linear infinite;animation-delay:-0s}.logo{transform-origin:27px 27px;animation:breathe 3.6s ease-in-out infinite;animation-delay:-0s}.halo{animation:halo 3.6s ease-in-out infinite;animation-delay:-0s}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.10)}}@keyframes halo{0%,100%{opacity:.22}50%{opacity:.85}}@media(prefers-reduced-motion:reduce){.orbit,.logo,.halo{animation:none}}</style></defs><rect x="5" y="5" width="44" height="44" rx="13" fill="#14232c" stroke="#8ed9ce" stroke-opacity=".25"/><rect class="halo" x="5" y="5" width="44" height="44" rx="13" fill="none" stroke="#8ed9ce" opacity=".35"/><g class="orbit"><circle cx="27" cy="3" r="1.8" fill="#8ed9ce"/></g><g class="logo" color="#8ed9ce"><g transform="translate(15 15)"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 8h20M9 12l-3 2 3 2m6-4 3 2-3 2"/></g></g></g></svg>
