<svg xmlns="http://www.w3.org/2000/svg" width="490" height="190" viewBox="0 0 490 190" role="img"><title>Emotion-Aware Books — NLP RESEARCH: Matching semantic meaning with readers' emotional intent.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d343b"/><stop offset=".53" stop-color="#172831"/><stop offset="1" stop-color="#15232b"/></linearGradient><radialGradient id="halo"><stop stop-color="#d2b4d3" stop-opacity=".23"/><stop offset="1" stop-color="#d2b4d3" stop-opacity="0"/></radialGradient><clipPath id="bounds"><rect x="3" y="3" width="484" height="184" rx="16"/></clipPath><style>.nudge{animation:nudge 2.8s ease-in-out infinite;animation-delay:-0.80s}.float{animation:drift 7s ease-in-out infinite;animation-delay:-0.60s}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@keyframes drift{0%,100%{transform:translate(0,0);opacity:.35}50%{transform:translate(-10px,5px);opacity:.7}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes stream{0%{transform:translateX(-260px);opacity:0}40%{opacity:.22}100%{transform:translateX(1050px);opacity:0}}@media(prefers-reduced-motion:reduce){.float,.pulse,.stream,.nudge,.scan{animation:none!important}}</style></defs><rect x="3" y="3" width="484" height="184" rx="16" fill="url(#bg)" stroke="#516c6c" stroke-width="1.5"/><g clip-path="url(#bounds)"><path d="M4 4H485L390 32H90Z" fill="#fff" opacity=".04"/><circle cx="421" cy="49" r="102" fill="url(#halo)" class="float"/><path d="M3 187H162" stroke="#d2b4d3" stroke-width="3" opacity=".66"/></g><g font-family="monospace"><circle cx="27" cy="31" r="4" fill="#d2b4d3" class="pulse"/><text x="41" y="36" font-size="12" fill="#d2b4d3" font-weight="bold" letter-spacing=".9">03 / NLP RESEARCH</text><text x="26" y="82" font-family="Georgia,serif" font-size="29" fill="#f7e9d2" font-weight="bold">Emotion-Aware Books</text><text x="27" y="115" font-size="16" fill="#c8d7d3">Match